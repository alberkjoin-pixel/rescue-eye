name: Build Rescue Eye APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Build Android APK
        run: |
          npm install @capacitor/cli@^7 @capacitor/core@^7 @capacitor/android@^7
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rescue-eye-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
